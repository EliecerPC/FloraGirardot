<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - FloraGirardot</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a class="logo-group" href="index.html" style="text-decoration:none;color:inherit">
            <img src="../public/assets/img/logo-floragirardot.svg" alt="FloraGirardot" class="logo-icon">
            <span class="logo-title">FloraGirardot</span>
        </a>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link">Catálogo</a>
            <a href="registro.html" class="nav-link">Crear cuenta</a>
        </nav>
    </div>
</header>
<main class="catalog-body" style="padding:3rem 5%;justify-content:center">
    <section class="filters-sidebar" style="max-width:520px;width:100%;margin:0 auto;padding:2rem;border-radius:20px">
        <h1 class="catalog-title">Iniciar sesión</h1>
        <p>Accede para enviar reportes o gestionar las tareas que correspondan a tu rol.</p>
        <form id="form-auth" data-mode="login">
            <label for="correo">Correo electrónico</label>
            <input class="search-input" id="correo" name="correo" type="email" autocomplete="email" maxlength="150" required style="width:100%;margin:.5rem 0 1rem">
            <label for="contrasena">Contraseña</label>
            <input class="search-input" id="contrasena" name="contrasena" type="password" autocomplete="current-password" required style="width:100%;margin:.5rem 0 1rem">
            <button type="submit" class="btn-card-white" style="background:#00b04f;color:white;border:0;padding:.8rem 1.5rem;border-radius:25px;cursor:pointer">Entrar</button>
        </form>
        <p id="auth-mensaje" role="status" aria-live="polite"></p>
        <p>¿Aún no tienes cuenta? <a href="registro.html">Regístrate como ciudadano</a>.</p>
    </section>
</main>
<script src="../public/js/auth.js"></script>
</body>
</html>
