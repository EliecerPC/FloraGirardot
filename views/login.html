<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - FloraGirardot</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a class="logo-group" href="index.html" style="text-decoration:none;color:inherit">
            <img src="../public/assets/img/logo-floragirardot.svg" alt="FloraGirardot" class="logo-icon">
            <span class="logo-title">FloraGirardot</span>
        </a>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link">Catálogo</a>
            <a href="registro.html" class="nav-link">Crear cuenta</a>
        </nav>
    </div>
</header>

<main class="auth-main">
    <section class="auth-card">
        <span class="auth-eyebrow">Comunidad FloraGirardot</span>

        <h1 class="auth-title">Iniciar sesión</h1>

        <p class="auth-description">
            Accede a tu cuenta para compartir observaciones de la flora
            urbana y consultar las funciones disponibles para tu usuario.
        </p>

        <form id="form-auth" data-mode="login" class="auth-form">
            <label for="correo">Correo electrónico</label>
            <input
                    class="auth-input"
                    id="correo"
                    name="correo"
                    type="email"
                    autocomplete="email"
                    maxlength="150"
                    placeholder="nombre@correo.com"
                    required
            >

            <label for="contrasena">Contraseña</label>
            <input
                    class="auth-input"
                    id="contrasena"
                    name="contrasena"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Ingresa tu contraseña"
                    required
            >

            <button type="submit" class="auth-submit">Entrar a mi cuenta</button>
        </form>

        <p id="auth-mensaje" class="auth-message" role="status" aria-live="polite"></p>

        <p class="auth-footer">
            ¿Aún no tienes cuenta?
            <a href="registro.html">Regístrate como ciudadano</a>.
        </p>
    </section>
</main>

<script src="../public/js/auth.js"></script>
<script src="../public/js/encabezado.js"></script></body>
</html>
