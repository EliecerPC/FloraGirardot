<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraGirardot - Ficha Técnica</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos y Script de Leaflet.js para el Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<!-- Header Superior -->
<header class="main-header">
    <div class="header-container">
        <div class="logo-group">
            <img src="../public/assets/img/logo-floragirardot.svg" alt="Isotipo FloraGirardot" class="logo-icon">
            <span class="logo-title">FloraGirardot</span>
        </div>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link active">Catálogo</a>
            <a href="#acerca" class="nav-link">Acerca de</a>
            <a href="catalogo.html" class="btn-buscar">Buscar</a>
        </nav>
    </div>
</header>

<!-- Layout Principal de la Ficha Técnica -->
<main class="sheet-container">

    <!-- Barra de Navegación Secundaria / Breadcrumbs -->
    <div class="breadcrumb-bar">
        <a href="catalogo.html" class="btn-return">Volver al catálogo</a>
        <div class="species-title-badge">Cargando...</div>
    </div>

    <!-- Bloque Superior: Galería y Datos Rápidos -->
    <section class="sheet-main-info">

        <!-- Columna Izquierda: Imagen Principal -->
        <div class="species-image-box">
            <img src="../public/assets/img/placeholder.jpg" alt="Especie de Girardot">
        </div>

        <!-- Columna Derecha: Tarjetas Taxonómicas -->
        <div class="species-details-box">
            <div class="section-badge-header">Ficha Técnica</div>
            <div class="taxonomy-list-card">
                <!-- Inyectado dinámicamente por ficha.js -->
            </div>
        </div>

    </section>

    <!-- Bloque Inferior 1: Descripción Botánica -->
    <section class="info-block-card">
        <h2>DESCRIPCIÓN BOTÁNICA</h2>
        <p><!-- Inyectado dinámicamente por ficha.js --></p>
    </section>

    <!-- Bloque Inferior 2: Distribución e Importancia Local -->
    <section class="info-block-card">
        <h2>IMPORTANCIA PARA GIRARDOT Y DISTRIBUCIÓN</h2>
        <p><!-- Inyectado dinámicamente por ficha.js --></p>
    </section>

    <!-- Bloque Inferior 3: Mapa Interactivo de Ubicación (Leaflet) -->
    <section class="info-block-card">
        <h2>REGISTRO DE UBICACIÓN EN GIRARDOT</h2>
        <p class="map-subtitle">Puntos georreferenciados de presencia en el municipio:</p>
        <div id="mapa-girardot" class="leaflet-map-box"></div>
    </section>

</main>

<script src="../public/js/ficha.js"></script>
</body>
</html>
