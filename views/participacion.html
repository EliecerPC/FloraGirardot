<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraGirardot - Participación Comunitaria</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header Superior -->
<header class="main-header">
    <div class="header-container">
        <div class="logo-group">
            <img src="../public/assets/img/logo-floragirardot.svg" alt="Isotipo FloraGirardot" class="logo-icon">
            <span class="logo-title">FloraGirardot</span>
        </div>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link">Catálogo</a>
            <a href="#acerca" class="nav-link">Acerca de</a>
            <a href="catalogo.html" class="btn-buscar">Buscar</a>
        </nav>
    </div>
</header>

<!-- Layout Principal de Participación -->
<main class="catalog-body" style="padding: 2rem 5%; gap: 2rem; align-items: start;">

    <!-- Columna Izquierda: Título y Lista de Reportes -->
    <section style="flex: 1; display: flex; flex-direction: column; gap: 1.5rem;">
        <h1 class="catalog-title" style="font-size: 2.2rem; line-height: 1.1;">Participación<br>Comunitaria</h1>

        <div class="filters-sidebar" style="width: 100%;">
            <span class="group-label" style="margin-bottom: 1rem; display: block;">ÚLTIMOS REPORTES DE LA COMUNIDAD</span>

            <div id="lista-aportes" style="display: flex; flex-direction: column; gap: 1rem;">
                <!-- Dinámico desde PostgreSQL / participacion.js -->
            </div>
        </div>
    </section>

    <!-- Columna Derecha: Formulario de Aporte -->
    <section class="filters-sidebar" style="flex: 1.5; padding: 2rem; border-radius: 20px;">
        <span class="group-label" style="margin-bottom: 1.5rem; display: block; font-size: 0.9rem;">FORMULARIO DE APORTE</span>

        <form id="form-aporte">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                <!-- Columna Inputs Texto -->
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <input type="text" id="input-planta" required placeholder="Planta" class="search-input" style="background: white; border: none; border-radius: 15px; padding: 1rem;">
                    <textarea id="input-notas" placeholder="Notas / Uso comunitario:" class="search-input" style="background: white; border: none; border-radius: 15px; padding: 1rem; height: 120px; resize: none;"></textarea>
                </div>

                <!-- Columna Área de Imagen -->
                <div id="drop-area" style="background: white; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; cursor: pointer; border: 2px dashed #00b04f; position: relative; overflow: hidden;">
                    <input type="file" id="input-imagen" accept="image/*" style="display: none;">

                    <div id="preview-container" style="display: flex; flex-direction: column; align-items: center;">
                        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="24" height="24" rx="6" fill="#00b04f"/>
                            <path d="M8.5 13.5L11 16.5L14.5 12L19 18H5L8.5 13.5Z" fill="white"/>
                            <circle cx="9" cy="9" r="1.5" fill="#FFC107"/>
                        </svg>
                        <span style="font-size: 0.8rem; color: #666; margin-top: 0.5rem;">Cargar Imagen</span>
                    </div>

                    <img id="img-preview" src="" alt="Previsualización" style="display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0;">
                </div>

            <!-- Input Ubicación en Fila Completa -->
            <div style="margin-bottom: 1.5rem;">
                <input type="text" id="input-ubicacion" required placeholder="Ubicación:" class="search-input" style="background: white; border: none; border-radius: 15px; padding: 1rem; width: 100%;">
            </div>

            <!-- Botón Centrado -->
            <div style="text-align: center;">
                <button type="submit" class="btn-card-white" style="background: #00b04f; color: white; border: none; padding: 0.8rem 2.5rem; border-radius: 25px; font-weight: 700; font-size: 1rem; cursor: pointer;">
                    Enviar Reporte
                </button>
            </div>
        </form>
        <div id="mensaje-feedback" style="margin-top: 1rem; text-align: center; font-weight: 600;"></div>
    </section>

</main>

<script src="../public/js/participacion.js"></script>
</body>
</html>
