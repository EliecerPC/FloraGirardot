<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - FloraGirardot</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="main-header">
    <div class="header-container">
        <a class="logo-group" href="index.html" style="text-decoration:none;color:inherit">
            <img src="../public/assets/img/logo-floragirardot.svg" alt="FloraGirardot" class="logo-icon">
            <span class="logo-title">FloraGirardot</span>
        </a>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link">Catálogo</a>
            <a href="login.html" class="nav-link">Iniciar sesión</a>
        </nav>
    </div>
</header>

<main class="auth-main">
    <section class="auth-card">
        <span class="auth-eyebrow">Comunidad FloraGirardot</span>

        <h1 class="auth-title">Únete a FloraGirardot</h1>

        <p class="auth-description">
            Crea tu cuenta ciudadana y comparte tus observaciones
            sobre las plantas y los espacios verdes de Girardot.
        </p>

        <form id="form-auth" data-mode="registro" class="auth-form">
            <label for="nombre">Nombre completo</label>
            <input
                    class="auth-input"
                    id="nombre"
                    name="nombre"
                    type="text"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    placeholder="¿Cómo te llamas?"
                    required
            >

            <label for="correo">Correo electrónico</label>
            <input
                    class="auth-input"
                    id="correo"
                    name="correo"
                    type="email"
                    autocomplete="email"
                    maxlength="150"
                    placeholder="nombre@correo.com"
                    required
            >

            <label for="contrasena">Contraseña</label>
            <input
                    class="auth-input"
                    id="contrasena"
                    name="contrasena"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    placeholder="Mínimo 8 caracteres"
                    required
            >

            <button type="submit" class="auth-submit">Crear mi cuenta</button>
        </form>

        <p id="auth-mensaje" class="auth-message" role="status" aria-live="polite"></p>

        <p class="auth-footer">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión</a>.
        </p>
    </section>
</main>

<script src="../public/js/auth.js"></script>
</body>
</html>
