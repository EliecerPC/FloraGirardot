<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraGirardot - Catálogo</title>
    <link rel="stylesheet" href="../public/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header Superior -->
<header class="main-header">
    <div class="header-container">
        <div class="logo-group">
            <img src="../public/assets/img/logo-floragirardot.svg" alt="Isotipo FloraGirardot" class="logo-icon">
            <span class="logo-title">FloraGirardot</span>
        </div>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="catalogo.html" class="nav-link active">Catálogo</a>
            <a href="participacion.html" class="nav-link">Participación</a>
            <a href="#acerca" class="nav-link">Acerca de</a>
            <a href="catalogo.html" class="btn-buscar">Buscar</a>
        </nav>
    </div>
</header>

<!-- Contenido Principal del Catálogo -->
<main class="catalog-layout">

    <!-- Encabezado y Buscador -->
    <div class="catalog-header-area">
        <h1 class="catalog-title">Catálogo</h1>
        <div class="search-bar-container">
            <!-- Buscador -->
            <input type="text" id="search-input" placeholder="Buscar por nombre común, científico..." class="search-input">
        </div>
    </div>

    <!-- Layout en 2 Columnas -->
    <div class="catalog-body">

        <!-- Columna Izquierda: Filtros -->
        <!-- Sidebar de Filtros -->
        <aside class="filters-sidebar">
            <h2 class="filters-title">Filtros de búsqueda</h2>

            <!-- Tipo de Planta -->
            <div class="filter-group">
                <span class="group-label">TIPO DE PLANTA</span>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-tipo" value="Árbol">
                    <span class="checkmark"></span> Árboles
                </label>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-tipo" value="Arbusto">
                    <span class="checkmark"></span> Arbustos
                </label>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-tipo" value="Florales">
                    <span class="checkmark"></span> Florales
                </label>
            </div>

            <!-- Origen -->
            <div class="filter-group">
                <span class="group-label">ORIGEN</span>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-origen" value="Nativa">
                    <span class="checkmark"></span> Nativa
                </label>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-origen" value="Introducida">
                    <span class="checkmark"></span> Introducida
                </label>
            </div>

            <!-- Hábitat -->
            <div class="filter-group">
                <span class="group-label">HÁBITAT</span>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-habitat" value="Ribera">
                    <span class="checkmark"></span> Ribera del Río
                </label>
                <label class="custom-checkbox">
                    <input type="checkbox" class="filter-habitat" value="Bosque Seco">
                    <span class="checkmark"></span> Bosque Seco
                </label>
            </div>
        </aside>

        <!-- Columna Derecha: Grilla de Tarjetas Dinámica -->
        <section class="cards-grid">
            <!-- Inyectado dinámicamente por catalogo.js desde PostgreSQL -->
        </section>

    </div>
</main>

<script src="../public/js/catalogo.js"></script>
</body>
</html>
